<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ZAKWAN</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@400;700&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--c:#B39157;--k:#232222;--k2:#1B1B1B;--bg:#F1E9DA;--soft:#E7DDC8;--fg:#232222;--mut:#6B655A;--gt:#7A5F31;--line:rgba(35,34,34,.16);--fb:'Alexandria','Poppins',sans-serif;--hw:700;--sec:clamp(44px,6vw,72px)}
html[lang=en]{--fb:'Poppins','Alexandria',sans-serif;--hw:600}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth;scroll-padding-top:72px;background:var(--k)}
body{background:var(--bg);color:var(--fg);font-family:var(--fb);font-weight:400;line-height:1.75;-webkit-font-smoothing:antialiased;overflow-x:hidden}
h1,h2,h3,.b{font-weight:var(--hw);line-height:1.25}
a{color:inherit;text-decoration:none}
img{display:block;max-width:100%}
:focus-visible{outline:2px solid var(--c);outline-offset:3px}
.wrap{max-width:1160px;margin-inline:auto;padding-inline:20px}
header{position:fixed;inset:0 0 auto;z-index:20;color:var(--bg);padding-top:env(safe-area-inset-top,0px);transition:background .3s,box-shadow .3s}
header.s{background:rgba(35,34,34,.96);backdrop-filter:blur(10px);box-shadow:0 1px 0 rgba(241,233,218,.14)}
.nav{display:flex;align-items:center;justify-content:space-between;height:64px;gap:16px}
.lgo{display:flex;align-items:center;gap:10px;direction:ltr}.lgo .m{height:34px;width:auto}.lgo .w{height:15px;width:auto}
.links{display:flex;gap:26px;font-size:14px}
.links a{opacity:.82;transition:opacity .2s}.links a:hover{opacity:1}
.tools{display:flex;gap:8px;align-items:center}
.pill{width:38px;height:38px;padding:0;display:grid;place-items:center;border:1px solid rgba(241,233,218,.5);background:none;color:var(--bg);border-radius:50%;cursor:pointer}.pill svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round}
.pill:hover{background:var(--bg);color:var(--k)}
.bg{display:none;width:38px;height:38px;border:1px solid rgba(241,233,218,.5);border-radius:50%;background:none;color:var(--bg);cursor:pointer;font-size:16px}
.hero{background:var(--k);color:var(--bg);position:relative;overflow:hidden;display:flex;flex-direction:column;padding:calc(64px + env(safe-area-inset-top,0px)) 0 0;min-height:clamp(540px,82svh,780px)}
.hero{--ov:linear-gradient(90deg,rgba(35,34,34,.92) 0%,rgba(35,34,34,.78) 40%,rgba(35,34,34,.38) 100%)}
html[dir=rtl] .hero{--ov:linear-gradient(270deg,rgba(35,34,34,.92) 0%,rgba(35,34,34,.78) 40%,rgba(35,34,34,.38) 100%)}
.hero::before{content:"";position:absolute;inset:0;z-index:1;pointer-events:none;background:linear-gradient(0deg,rgba(35,34,34,.75) 0%,transparent 26%),radial-gradient(60% 70% at 80% 40%,rgba(179,145,87,.16),transparent 70%),var(--ov)}
.hro-bg{position:absolute;inset:0;z-index:0;width:100%;height:100%;object-fit:cover;object-position:50% 70%}
.hero .wrap{position:relative;z-index:1;width:100%}
.hero h1{font-size:clamp(28px,3.6vw,50px);line-height:1.45;max-width:13em;text-wrap:balance}
html[lang=en] .hero h1{line-height:1.16;letter-spacing:-.01em}
.hero p{margin:24px 0 0;max-width:44ch;font-size:clamp(16px,1.5vw,19px);line-height:1.9;opacity:.86}
.hm{flex:1;display:flex;align-items:center;justify-content:flex-start;padding-block:clamp(56px,8vw,104px)}
.hro-txt{max-width:560px}
.hf{position:relative;z-index:1;padding-bottom:24px}
.cta{display:flex;gap:14px;flex-wrap:wrap;margin-top:40px;animation:up .9s .3s cubic-bezier(.2,.7,.2,1) both}
.btn{display:inline-block;padding:13px 30px;border:1px solid transparent;border-radius:99px;background:var(--bg);color:var(--k);font-weight:var(--hw);font-size:15px;line-height:1.5;transition:transform .25s,background .25s}
.btn:hover{transform:translateY(-2px)}
.hero .btn:not(.o){background:var(--c);color:var(--k)}.hero .btn:not(.o):hover{background:var(--bg)}
.btn.o{background:none;color:var(--bg);border:1px solid rgba(241,233,218,.55)}.btn.o:hover{background:rgba(241,233,218,.1)}
.hbar{display:flex;justify-content:space-between;align-items:center;gap:16px;border-top:1px solid rgba(241,233,218,.26);padding-top:16px;font-size:13px}
html[lang=en] .hbar{letter-spacing:.1em;text-transform:uppercase}
.sc{display:flex;align-items:center;gap:10px}.sc i{width:1px;height:30px;background:var(--c);transform-origin:top;animation:ln 2.4s ease-in-out infinite}
@keyframes ln{0%{transform:scaleY(0);opacity:1}55%{transform:scaleY(1);opacity:1}100%{transform:scaleY(1);opacity:0}}
.hero h1,.hero p{animation:up .9s cubic-bezier(.2,.7,.2,1) both}.hero p{animation-delay:.15s}
@keyframes up{from{opacity:0;transform:translateY(22px)}}
section{padding:var(--sec) 0}
.hd{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:32px;flex-wrap:wrap}
h2{font-size:clamp(26px,3.6vw,42px)}
.hd p{color:var(--mut);max-width:40ch}
.work{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.tile{position:relative;aspect-ratio:4/3;border-radius:18px;overflow:hidden;isolation:isolate;background:var(--k)}
.tile svg{position:absolute;inset:0;width:100%;height:100%;transition:transform .6s cubic-bezier(.2,.7,.2,1)}
.tile:hover svg{transform:scale(1.05)}
.svc h3{font-size:20px;margin:16px 0 6px}.svc p{color:var(--mut);font-size:15px}
.about{background:var(--k2);color:var(--bg)}
.about .wrap{display:grid;grid-template-columns:1fr 1fr;gap:clamp(28px,5vw,64px);align-items:start}
.about p{color:#CFC6B2;margin-top:16px;max-width:52ch}
.vals div{display:flex;gap:16px;padding:18px 0;border-top:1px solid rgba(241,233,218,.16)}
.vals div:last-child{border-bottom:1px solid rgba(241,233,218,.16)}
.vals b{min-width:112px;color:var(--c);font-size:18px}.vals span{color:#CFC6B2;font-size:15px}
.rows{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
.row{border-inline-start:3px solid var(--c);padding:6px 18px}
.row small{display:block;color:var(--mut);font-size:13px}.row b{font-size:17px}.row b.m{color:var(--mut);font-weight:400}.row a:hover{text-decoration:underline}
.fnd{display:grid;grid-template-columns:auto 1fr;direction:ltr;gap:clamp(24px,5vw,64px);align-items:center}
html[dir=rtl] .fnd>div:last-child{direction:rtl;text-align:right}
.soft{background:var(--soft)}
.ph{width:clamp(170px,26vw,290px);aspect-ratio:1;border-radius:50%;background:var(--k);color:var(--bg);display:grid;place-items:center;align-content:center;gap:10px;text-align:center;padding:0;overflow:hidden;box-shadow:0 0 0 5px var(--soft),0 0 0 7px var(--c)}
.ph img{width:100%;height:100%;object-fit:cover;object-position:50% 20%;border-radius:50%}
.fnd h2{font-size:clamp(28px,4vw,44px)}
.role{color:var(--gt);font-size:17px;margin:4px 0 20px}
.fnd blockquote{border-inline-start:3px solid var(--c);padding-inline-start:20px;font-size:clamp(16px,2vw,20px);max-width:48ch}
footer{background:var(--k2);color:#A89F8C;text-align:center;font-size:13px;padding:22px 20px calc(22px + env(safe-area-inset-bottom,0px))}
@media(max-width:900px){
.links{position:fixed;inset:calc(64px + env(safe-area-inset-top,0px)) 0 auto;background:var(--bg);color:var(--fg);box-shadow:0 14px 28px rgba(0,0,0,.14);flex-direction:column;gap:0;padding:8px 20px 16px;display:none}
.links.o{display:flex}.links a{padding:13px 0;border-bottom:1px solid var(--line);opacity:1}
.bg{display:block}
.rows,.about .wrap{grid-template-columns:1fr}
.work{grid-template-columns:repeat(2,1fr)}
.hero{min-height:clamp(520px,64svh,640px)}
.cta{margin-top:32px}
.hm{align-items:flex-start;padding-block:56px 64px}
html .hero,html[dir=rtl] .hero{--ov:linear-gradient(180deg,rgba(35,34,34,.84) 0%,rgba(35,34,34,.72) 55%,rgba(35,34,34,.82) 100%)}
.hro-bg{object-position:60% 62%}
.hero h1{max-width:100%;font-size:clamp(28px,7.4vw,40px);line-height:1.45}.hero p{max-width:34ch;text-wrap:balance;font-size:clamp(16px,4.4vw,19px)}
}
@media(max-width:520px){.work{gap:22px 10px}.svc h3{font-size:17px}.svc p{font-size:14px}.fnd{grid-template-columns:1fr;justify-items:center}.fnd>div:last-child{width:100%}.ph{width:150px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
